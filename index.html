<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Vocab Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --text: #f0eff4;
    --muted: #8b8a9b;
    --accent: #7c6af7;
    --accent-dim: #2d2650;
    --green: #3ecf8e;
    --green-dim: #0d3326;
    --red: #f56565;
    --red-dim: #3b1010;
    --gold: #f5c842;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2.5rem;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .mode-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px;
    display: flex;
    gap: 2px;
  }

  .mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mode-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .stats-row {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-val {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }

  .stat-val.accent { color: var(--accent); }
  .stat-val.green { color: var(--green); }

  .progress-wrap {
    width: 100%;
    max-width: 640px;
    height: 3px;
    background: var(--surface2);
    border-radius: 3px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    margin-bottom: 1.25rem;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }

  .pos-badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 1rem;
    width: fit-content;
  }

  .def-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    line-height: 1.5;
    color: var(--text);
  }

  .q-counter {
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  .choices {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1rem;
  }

  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    line-height: 1.3;
  }

  .choice-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.98); }

  .choice-btn.correct {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
  }

  .choice-btn.wrong {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
  }

  .choice-btn:disabled { cursor: default; }

  .feedback {
    width: 100%;
    max-width: 640px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    min-height: 24px;
    transition: color 0.2s;
  }

  .feedback.good { color: var(--green); }
  .feedback.bad { color: var(--red); }

  .streak-flame {
    display: inline-block;
    margin-right: 4px;
  }

  /* Keyframe for card entrance */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card, .choices { animation: fadeUp 0.22s ease both; }

  /* Dark mode system override - already dark */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f4f9;
      --surface: #ffffff;
      --surface2: #eeedf5;
      --border: #dddce8;
      --text: #1a1929;
      --muted: #7a788f;
      --accent: #6355e8;
      --accent-dim: #ece9ff;
      --green: #1a9e66;
      --green-dim: #d4f5e7;
      --red: #d63f3f;
      --red-dim: #fde8e8;
      --gold: #c48b00;
    }
    .card::before { opacity: 0.2; }
  }

  @media (max-width: 500px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .stat-val { font-size: 20px; }
    .def-text { font-size: 1.2rem; }
    .choice-btn { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">SAT<span>vocab</span></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-def" onclick="setMode('def')">Definition → Word</button>
    <button class="mode-btn" id="btn-word" onclick="setMode('word')">Word → Definition</button>
  </div>
</header>

<div class="stats-row">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val accent" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Streak</div><div class="stat-val" id="streak">0</div></div>
  <div class="stat"><div class="stat-label">Seen</div><div class="stat-val" id="seen">0</div></div>
  <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-val green" id="accuracy">—</div></div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>

<div class="card" id="main-card">
  <div class="q-counter" id="q-counter"></div>
  <div class="pos-badge" id="pos-tag"></div>
  <div class="def-text" id="prompt-text">Loading...</div>
</div>

<div class="choices" id="choices"></div>
<div class="feedback" id="feedback"></div>

let queue = [], score = 0, total = 0, streak = 0, current = null, answered = false;
let mode = 'def'; // 'def' = show definition, guess word | 'word' = show word, guess definition

function setMode(m) {
  mode = m;
  document.getElementById('btn-def').classList.toggle('active', m === 'def');
  document.getElementById('btn-word').classList.toggle('active', m === 'word');
  score = 0; total = 0; streak = 0;
  updateStats();
  queue = [];
  next();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function refill() {
  const q = [...WORDS];
  shuffle(q);
  queue = q;
}

function next() {
  if (queue.length === 0) refill();
  current = queue.pop();
  answered = false;
  render();
}

function getWrongOptions() {
  const pool = WORDS.filter(w => w[0] !== current[0]);
  shuffle(pool);
  return pool.slice(0, 3);
}

function posLabel(p) {
  return p === 'v' ? 'verb' : p === 'n' ? 'noun' : p === 'adj' ? 'adjective' : p === 'adv' ? 'adverb' : p;
}

function render() {
  const [word, pos, def] = current;
  const wrongs = getWrongOptions();
  const opts = [current, ...wrongs];
  shuffle(opts);

  document.getElementById('q-counter').textContent = `Q${total + 1}`;
  document.getElementById('pos-tag').textContent = posLabel(pos);
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  if (mode === 'def') {
    document.getElementById('prompt-text').textContent = def;
  } else {
    document.getElementById('prompt-text').textContent = word;
  }

  document.getElementById('prog').style.width = (Math.min((total % 50) / 50 * 100, 100)) + '%';

  const container = document.getElementById('choices');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = mode === 'def' ? opt[0] : opt[2];
    btn.dataset.word = opt[0];
    btn.onclick = () => pick(btn);
    container.appendChild(btn);
  });
}

function pick(btn) {
  if (answered) return;
  answered = true;
  total++;

  const isCorrect = btn.dataset.word === current[0];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.dataset.word === current[0]) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    streak++;
    btn.classList.add('correct');
    if (streak >= 10) {
      fb.textContent = `🔥 ${streak} streak — you're on fire!`;
      fb.className = 'feedback good';
    } else if (streak >= 5) {
      fb.textContent = `🔥 ${streak} in a row!`;
      fb.className = 'feedback good';
    } else if (streak >= 3) {
      fb.textContent = `Nice — ${streak} streak!`;
      fb.className = 'feedback good';
    } else {
      fb.textContent = 'Correct!';
      fb.className = 'feedback good';
    }
  } else {
    btn.classList.add('wrong');
    streak = 0;
    fb.textContent = mode === 'def'
      ? `The answer was "${current[0]}" — ${current[2]}`
      : `The answer was: ${current[2]}`;
    fb.className = 'feedback bad';
  }

  updateStats();
  setTimeout(next, isCorrect ? 900 : 1800);
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
  document.getElementById('seen').textContent = total;
  document.getElementById('accuracy').textContent = total > 0 ? Math.round(score / total * 100) + '%' : '—';
}

refill();
next();
</script>
